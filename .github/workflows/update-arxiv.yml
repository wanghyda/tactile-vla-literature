name: Update arXiv candidates

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/update_arxiv.py --output sources/arxiv-candidates.json
      - name: Commit candidate update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/arxiv-candidates.json
          git diff --cached --quiet || git commit -m "chore: update arXiv candidates"
          git push

